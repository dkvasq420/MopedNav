name: Build release AAB (quiet)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scootroute.keystore"

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/scootroute.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if ! ./gradlew bundleRelease --console=plain > build.log 2>&1; then
            {
              echo "## Build failed - errors"
              echo '```'
              grep -nE "error:|^e: |What went wrong|Caused by" -A4 build.log | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "BUILD FAILED. Open the Summary page of this run to read the errors."
            exit 1
          fi

      - name: Save build log (only if it failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: scootroute-aab
          path: app/build/outputs/bundle/release/*.aab
