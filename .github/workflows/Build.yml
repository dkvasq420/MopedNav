      - name: Fix Gradle wrapper and clear stale 6.9 cache
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
          rm -rf /home/test/.gradle/wrapper/dists/gradle-6.9* \
                 "${GRADLE_USER_HOME:-$HOME/.gradle}"/wrapper/dists/gradle-6.9* || true

      - name: Build signed release AAB
        run: ./gradlew :app:bundleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          
