name: Build Unsigned Android Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Gradle 8.7 wrapper exists
        run: |
          mkdir -p gradle/wrapper

          cat <<'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar

          cat <<'EOF' > gradlew
          #!/usr/bin/env sh
          exec java ${DEFAULT_JVM_OPTS} ${JAVA_OPTS} ${GRADLE_OPTS} \
            -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain "$@"
          EOF

          chmod +x ./gradlew

      - name: Build unsigned release AAB
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: scootroute-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
