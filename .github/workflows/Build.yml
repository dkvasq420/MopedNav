name: Build Android Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        run: |
          mkdir -p app
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > app/release.keystore

      - name: Verify release keystore file and alias
        run: |
          if [ ! -s app/release.keystore ]; then
            echo "ERROR: app/release.keystore is missing or 0 bytes. Check RELEASE_KEYSTORE_BASE64 secret."
            ls -la app/
            exit 1
          fi
          ls -lh app/release.keystore
          keytool -list -keystore app/release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS"
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Replace broken gradlew stub and configure Gradle 8.7 wrapper
        run: |
          echo "--- Old gradlew contents ---"
          cat gradlew || true

          mkdir -p gradle/wrapper

          cat <<'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar

          cat <<'EOF' > gradlew
          #!/usr/bin/env sh
          exec java ${DEFAULT_JVM_OPTS} ${JAVA_OPTS} ${GRADLE_OPTS} \
            -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain "$@"
          EOF

          chmod +x ./gradlew
          ./gradlew --version

      - name: Build signed release AAB
        run: ./gradlew :app:bundleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: scootroute-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
